{% load activity_tags ctype_tags %}

<div class="menu-context">
  <div class="action-group">
    <ul>
      {% if perms.alibrary.change_media %}
        <li class="action">
          <a href="{{ object.get_edit_url }}" title="Edit">
            Edit
          </a>
        </li>
      {% endif %}
      {% if perms.alibrary.change_media and user.is_staff %}
        <li class="action">
          <a href="{{ object.get_admin_url }}?next={{ object.get_absolute_url }}"
             title="Administration view">
            Admin view
          </a>
        </li>
      {% endif %}
      {% if perms.alibrary.downoad_media %}
        <li class="action">
          <a href="#" data-action="download" data-ct="media" data-id="{{ object.pk }}"
             title="Download">
            Download
          </a>
        </li>
      {% endif %}
    </ul>
  </div>
</div>
