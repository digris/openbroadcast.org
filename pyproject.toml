[project]
name = "obp-next"
dynamic = ["version"]
description = "openbroadcast.org - Music Platform"
authors = [{ name = "Jonas Ohrstrom", email = "jonas.ohrstrom@digris.ch" }]
license = "MIT"
requires-python = ">=3.8, <3.13"

dependencies = [
    "Django==1.11.26",
    "Pillow==2.9.0",
    "URLObject==2.3.4",
    "discogs-client==2.3.0",
    "mailchimp==2.0.9",
    # "mimeparse==0.1.3",
    "python-Levenshtein==0.11.2",
    "python-magic==0.4.6",
    "python-stdnum==1.0",
    "requests==2.9.1",
    "xmltodict==0.9.2",
    "tqdm==3.8.0",
    "Wand==0.4.4",
    "semver==2.7.7",
    "phonenumbers==8.8.10",
    "django-phonenumber-field==1.3.0",
    "gunicorn==19.7.1",
    "uWSGI==2.0.15",
    "raven==5.33",
    "django-cors-headers==2.1.0",
    "django-absolute>=0.3,<0.4",
    "django-auditlog==0.3.2",
    "django-avatar==2.0",
    "django-braces==1.8.1",
    "django-cacheops==4.2",
    "django-click==1.2.0",
    "django-compressor==1.6",
    "django-countries==5.5",
    "django-dajax==0.9.2",
    "django-dajaxice==0.7",
    "django-date-extensions==3.0",
    "django-el-pagination==3.0.1",
    "django-extensions==3.0.3",
    "django-filter==1.1.0",
    "django-floppyforms==1.7.0",
    "django-formtools==2.1",
    "django-gravatar2==1.4.0",
    "django-hvad==1.8.0",
    "django-mailer==0.1.0",
    "django-missing==0.1.11",
    "django-model-utils==2.3.1",
    "django-mptt==0.8.7",
    "django-navutils==0.7",
    "django-oauth2-provider==0.2.6.1",
    "django-polymorphic==1.2",
    "django-redis==4.2.0",
    "redis==2.10.5",
    "django-sekizai==0.10.0",
    "django-settings-export==1.2.1",
    "django-split-settings==0.1.2",
    "django-versatileimagefield==1.7.1",
    "django-simple-captcha==0.5.1",
    "jsonfield==2.0.2",
    "easy-thumbnails==2.6",
    "django-appconf==1.0.3",
    "django-classy-tags==0.7.2",
    "social-auth-app-django==3.1.0",
    "social-auth-core==3.1.0",
    "elasticsearch-dsl==6.1.0",
    "django-elasticsearch-dsl==0.5.0",
    "coreapi==2.3.1",
    "djangorestframework==3.6.4",
    "drf-flex-fields==0.3.4",
    "django-treebeard==4.2.1",
    "audioread==1.0.1",
    "XlsxWriter==1.1.2",
    "django-qsstats-magic==1.0.0",
    "uritemplate==3.0.1",
    "persisting-theory==0.2.1",
    "elasticsearch==6.3.1",
    "celery==5.2.7",
    "django-adv-cache-tag==1.1.3",
    "markdown==3.1.1",
    "django-tastypie==0.13.3",
    # "graypy @ pip-legacy-packages/graypy",
    # "pyacoustid @ pip-legacy-packages/pyacoustid",
    "graypy",
    "pyacoustid",
    "django-environ>=0.11.2",
    "setuptools>=75.3.4,<82",
]

[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["obp_core"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.uv]
package = true

[tool.uv.sources]
graypy = { path = "pip-legacy-packages/graypy" }
pyacoustid = { path = "pip-legacy-packages/pyacoustid" }

[dependency-groups]
dev = [
    "PyMySQL==0.10.1",
]
