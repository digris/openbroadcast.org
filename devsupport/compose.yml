services:
  nginx:
    # container_name: nginx
    build:
      context: ${PWD}/nginx/
      # dockerfile: ${PWD}/nginx/Dockerfile
    ports:
      - "8888:80"
    volumes:
      - ${PWD}/website/media:/data/media
    restart: always
    networks:
      - obp
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mariadb:
    # container_name: mariadb
    image: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: obp
      MYSQL_PASSWORD: obp
      MYSQL_DATABASE: obp
    volumes:
      - obp-mariadb:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - obp
  rabbitmq:
    # container_name: rabbitmq
    build:
      context: ${PWD}/rabbitmq/
      # dockerfile: Dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    networks:
      - obp
  redis:
    # container_name: redis
    image: redis:5.0.5
    ports:
      - "6379:6379"
    restart: always
    networks:
      - obp
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:6.8.20
    platform: linux/amd64   # force amd64 - no arm image for elasticsearch 6.8
    environment:
      - cluster.name=obp
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - obp-elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: always
    networks:
      - obp
  pushy:
    # container_name: pushy
    build:
      context: ${PWD}/../
      dockerfile: ${PWD}/pushy/Dockerfile
    ports:
      - "5001:8000"
    restart: always
    networks:
      - obp
  waveform:
    # container_name: waveform
    build:
      context: ${PWD}/../
      dockerfile: ${PWD}/waveform/Dockerfile
    ports:
      - "5002:8000"
    restart: always
    networks:
      - obp

volumes:
  obp:
  obp-mariadb:
  obp-elasticsearch:

networks:
  obp:
