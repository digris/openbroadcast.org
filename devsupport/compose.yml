# name: obp

services:
  #####################################################################
  # proxy: the only http entry point. routing: devsupport/proxy/Caddyfile
  #####################################################################
  proxy:
    image: caddy:2-alpine
    ports:
      - "5000:5000"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - obp
    depends_on:
      - core
      - ui
      - pushy

  #####################################################################
  # services
  #####################################################################
  mariadb:
    # container_name: mariadb
    image: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: obp
      MYSQL_PASSWORD: obp
      MYSQL_DATABASE: obp
    volumes:
      - obp-mariadb:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - obp
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uobp", "-pobp"]
      interval: 5s
      timeout: 2s
      retries: 20
  rabbitmq:
    # container_name: rabbitmq
    build:
      context: ${PWD}/rabbitmq/
      # dockerfile: Dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    networks:
      - obp
  redis:
    # container_name: redis
    image: redis:5.0.5
    ports:
      - "6379:6379"
    restart: always
    networks:
      - obp
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:6.8.20
    platform: linux/amd64   # force amd64 - no arm image for elasticsearch 6.8
    environment:
      - cluster.name=obp
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - obp-elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: always
    networks:
      - obp
  pushy:
    # container_name: pushy
    build:
      context: ${PWD}/../
      dockerfile: ${PWD}/pushy/Dockerfile
    ports:
      - "5001:8000"
    restart: always
    networks:
      - obp
  waveform:
    # container_name: waveform
    build:
      context: ${PWD}/../
      dockerfile: ${PWD}/waveform/Dockerfile
    ports:
      - "5002:8000"
    restart: always
    networks:
      - obp

  #####################################################################
  # app
  #####################################################################
  core:
    build:
      context: ${PWD}/../
      dockerfile: ${PWD}/core/Dockerfile
    image: obp/core:latest
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: true
      SITE_URL: http://obp-next.local:5000
      DATABASE_URL: mysql://obp:obp@mariadb:3306/obp
      CELERY_BROKER_URL: amqp://obp:obp@rabbitmq:5672/obp
      PLAYOUT_BROKER_URL: amqp://obp:obp@rabbitmq:5672/obp/playout
      ELASTICSEARCH_URL: elasticsearch:9200
      WAVEFORM_SERVICE_ENDPOINT: http://waveform:8000/
      CACHEOPS_REDIS: redis://redis:6379/0
      PUSHY_REDIS_HOST: redis
      # as seen from the browser: socket.io is routed through the proxy
      PUSHY_SOCKET_SERVER: //obp-next.local:5000/
    volumes:
      # db dumps, media files (MEDIA_ROOT, config.settings.base), tmp
      - ../data:/app/data
    networks:
      - obp
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started

  ui:
    build:
      context: ${PWD}/../
      dockerfile: ${PWD}/ui/Dockerfile
    image: obp/ui:latest
    environment:
      # bundle & hmr socket are reached through the proxy (same origin)
      WEBPACK_PUBLIC_PATH: /static/js/
      WEBPACK_SOCK_PORT: location
      WEBPACK_PROXY_TARGET: http://core:5000
    networks:
      - obp

volumes:
  obp:
  obp-mariadb:
  obp-elasticsearch:

networks:
  obp:
